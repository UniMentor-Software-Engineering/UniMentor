# Render Blueprint (ADR 7): the backend API. The PostgreSQL database is on Supabase
# (free plan, no expiry), because Render's free PostgreSQL expires after 30 days.
# In Render: New > Blueprint > select this repository, then set DATABASE_URL by hand.
# The API redeploys automatically on every push to main that changes backend/
# (the Render GitHub App must be installed on the organization).
services:
  - type: web
    name: unimentor-api
    runtime: node
    plan: free
    rootDir: backend
    # Production install: exact versions from package-lock.json, without devDependencies.
    buildCommand: npm ci --omit=dev
    # Applies the pending migrations before starting; if one fails, the new version does not start.
    startCommand: npm run db:migrate && npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      # Supabase "Session pooler" connection string (port 5432): it keeps each transaction on
      # one connection, which SELECT ... FOR UPDATE needs (CU-08). Never commit its value.
      - key: DATABASE_URL
        sync: false
      - key: DB_SSL
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      # University email domains that can register (CU-01).
      - key: ALLOWED_EMAIL_DOMAINS
        value: myuax.com
      # Set manually in the Render dashboard to the Vercel URL. The name unimentor.vercel.app
      # belongs to someone else, so the team's project needs a different one.
      - key: FRONTEND_ORIGIN
        sync: false
      # P5 email (ADR 6). Brevo is used when BREVO_API_KEY is set (SendGrid still works with
      # SENDGRID_API_KEY). Without a key, emails are only written to the log.
      # EMAIL_FROM must be a sender verified in the provider; APP_URL is the Vercel URL.
      - key: BREVO_API_KEY
        sync: false
      - key: SENDGRID_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: APP_URL
        sync: false
      - key: EMAIL_TIMEZONE
        value: Europe/Madrid
