# NFR-01: directory queries under 200 ms (95th percentile) with 50 concurrent virtual users.
# Usage (from backend/, with the API running):
#   npm run test:load
#   npx artillery@2 run --target https://your-api.onrender.com tests/load/directory.yml
# 50 users join during the first 10 seconds and each keeps searching for about a minute.
# The run fails if the 95th percentile goes over 200 ms. A slot availability scenario
# (CU-07) has to be added when that endpoint exists.
config:
  target: http://localhost:3000
  phases:
    - name: 50-concurrent-users
      duration: 10
      arrivalRate: 5
  ensure:
    thresholds:
      - http.response_time.p95: 200
    maxErrorRate: 0
scenarios:
  - name: Search the tutor directory
    flow:
      - loop:
          - get:
              url: /api/tutors
          - get:
              url: /api/tutors?search=garcia
          - get:
              url: /api/subjects
          - think: 1
        count: 60
