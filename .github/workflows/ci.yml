name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend lint and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      # npm ci installs exactly what package-lock.json says and fails if it is out of sync.
      - name: Install dependencies
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      - name: Test with coverage (Jest, NFR-04 >= 70 %)
        run: npm run test:coverage

      - name: Audit production dependencies (NFR-02)
        run: npm audit --omit=dev --audit-level=high
