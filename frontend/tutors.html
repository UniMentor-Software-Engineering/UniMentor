<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Find Tutors · UniMentor</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/tutors.css" />
    <link rel="stylesheet" href="css/booking.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="container">
        <a class="brand" href="index.html">UniMentor</a>
        <div class="header-actions">
          <nav id="app-nav" class="app-nav" aria-label="Main"></nav>
          <span id="user-name" class="text-muted" hidden></span>
          <a id="sign-in-link" class="btn btn-secondary" href="login.html">Sign in</a>
          <button id="logout-button" type="button" class="btn btn-secondary" hidden>Sign out</button>
        </div>
      </div>
    </header>

    <main class="container stack">
      <h1>Find Tutors</h1>
      <p class="text-muted">Search by name, subject or topic. Tutors with the earliest free slot come first.</p>

      <form id="search-form" class="card search-form" role="search">
        <div class="form-field">
          <label for="search">Search</label>
          <input id="search" name="search" type="search" class="input" maxlength="100" placeholder="e.g. Algebra, García, SOFT301" />
        </div>
        <div class="form-field">
          <label for="subject">Subject</label>
          <select id="subject" name="subject" class="input">
            <option value="">All subjects</option>
          </select>
        </div>
        <button type="submit" class="btn btn-primary">Search</button>
      </form>

      <p id="results-status" class="text-muted" aria-live="polite"></p>
      <div id="results" class="tutor-grid"></div>
      <div class="results-footer">
        <button id="load-more" type="button" class="btn btn-secondary" hidden>Load more</button>
      </div>
    </main>

    <!-- CU-08: booking confirmation. Filled by tutors.js. -->
    <dialog id="booking-dialog" class="modal" aria-labelledby="booking-title">
      <form id="booking-form" method="dialog" class="stack" novalidate>
        <h2 id="booking-title">Book a session</h2>
        <p id="booking-summary" class="notice notice-info"></p>

        <fieldset class="choice-list" id="session-types">
          <legend>Session type</legend>
        </fieldset>

        <div class="form-field">
          <label for="inquiry">What do you need help with? <span class="text-muted">(optional)</span></label>
          <textarea id="inquiry" name="inquiry" class="input" rows="4" maxlength="1000" placeholder="e.g. I don't understand how pipelining hazards are resolved"></textarea>
          <p id="inquiry-counter" class="text-muted">0 / 1000</p>
        </div>

        <p id="booking-error" class="field-error" role="alert"></p>

        <div class="modal-actions">
          <button type="button" class="btn btn-secondary" data-close>Back</button>
          <button type="submit" class="btn btn-primary" id="confirm-booking">Confirm Booking</button>
        </div>
      </form>
    </dialog>

    <script type="module" src="js/tutors.js"></script>
  </body>
</html>
